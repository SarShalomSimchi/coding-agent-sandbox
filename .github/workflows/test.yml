name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject tracked Python cache files
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git ls-files | grep -E '(^|/)__pycache__/|\.py[cod]$' || true)"
          if [ -n "$matches" ]; then
            echo "Tracked Python cache files are forbidden:"
            printf '%s\n' "$matches"
            exit 1
          fi
      - run: python -m unittest discover -s tests -v
